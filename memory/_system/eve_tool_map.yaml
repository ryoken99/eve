      - backup
      - diff
      - py_compile_if_code
      - rollback_available
    forbidden: false

  apply_authorized_self_edit:
    command: ".venv/Scripts/python.exe scripts/stage2_apply_authorized_self_edit.py"
    path: scripts/stage2_apply_authorized_self_edit.py
    description: "Apply an already granted one-shot self-edit."
    status: available
    risk: medium
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: true
    requires_special_authorization: false
    codex_optional: true
    external_effect: false
    dry_run_required: false
    logs_to: memory/_processed/autonomy/self_edits/
    transcript_channel: system
    tests_required:
      - py_compile
      - import_module
      - rollback_available
    forbidden: false

  stage2_permission_status:
    command: ".venv/Scripts/python.exe scripts/stage2_permission_status.py"
    path: scripts/stage2_permission_status.py
    description: "Show Stage 2 permission request/grant state."
