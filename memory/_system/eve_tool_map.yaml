tools:
  awareness_status:
    command: ".venv/Scripts/python.exe scripts/awareness_status.py"
    path: scripts/awareness_status.py
    description: "Report local operational awareness."
    status: available
    risk: low
    allowed_without_confirmation: true
    allowed_with_one_shot_grant: true
    requires_special_authorization: false
    codex_optional: false
    external_effect: false
    dry_run_required: false
    logs_to: memory/runtime/awareness/
    transcript_channel: system
    tests_required: []
    forbidden: false

  awareness_healthcheck:
