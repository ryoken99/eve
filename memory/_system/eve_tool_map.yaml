    command: null
    path: tools/telegram_bridge.py
    description: "Modify Telegram Bridge runtime."
    status: available
    risk: high
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: true
    requires_special_authorization: false
    codex_optional: true
    external_effect: true
    dry_run_required: true
    logs_to: logs/telegram_bridge/
    transcript_channel: system
    tests_required:
      - py_compile
      - import_module
      - check_telegram_bridge
    forbidden: false

  webui_modification:
    command: null
    path: app/eve_web.py
    description: "Modify Web UI runtime."
    status: available
    risk: high
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: true
    requires_special_authorization: false
    codex_optional: true
    external_effect: true
    dry_run_required: true
    logs_to: logs/runtime/
    transcript_channel: system
    tests_required:
      - py_compile
      - import_module
      - webui_healthcheck
    forbidden: false

  scheduled_task_install:
    command: "powershell.exe -ExecutionPolicy Bypass -File scripts/install_daily_memory_rollover_task.ps1"
    path: scripts/install_daily_memory_rollover_task.ps1
    description: "Install or modify Windows scheduled tasks."
    status: available
    risk: critical
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: false
    requires_special_authorization: true
    codex_optional: true
    external_effect: true
    dry_run_required: true
    logs_to: memory/runtime/permissions/audit/
    transcript_channel: system
    tests_required: []
    forbidden: false

  x_posting:
    command: null
    path: tools/
    description: "Post externally to X."
    status: available
    risk: critical
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: false
    requires_special_authorization: true
    codex_optional: true
    external_effect: true
    dry_run_required: true
    logs_to: logs/
    transcript_channel: tools
    tests_required:
      - explicit_final_confirmation
    forbidden: false

  secrets:
    command: null
    path: secrets/
    description: "Secrets, tokens and vault data."
    status: available
    risk: critical
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: false
    requires_special_authorization: true
    codex_optional: false
    external_effect: false
    dry_run_required: false
    logs_to: null
    transcript_channel: null
    tests_required: []
    forbidden: true

  critical_special_permission:
    tool_id: critical_special_permission
    command: ".venv/Scripts/python.exe scripts/stage2_grant_special_permission.py"
    path: scripts/stage2_grant_special_permission.py
    description: "Grant a critical special one-shot permission with exact Sandro phrase."
    status: available
    risk: critical
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: false
    requires_special_authorization: true
    external_effect: false
    dry_run_required: true
    logs_to: memory/runtime/permissions/audit/
    transcript_channel: system
    tests_required: [exact_phrase, request_id_match, dry_run_exists]
    rollback_strategy: "consume grant and no-op for external critical actions unless separately authorized"
    codex_optional: false
    forbidden_without_authorization: true

  git_push:
    tool_id: git_push
    command: "git push"
    path: null
    description: "Push changes to GitHub."
    status: available
    risk: critical
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: false
    requires_special_authorization: true
    external_effect: true
    dry_run_required: true
    logs_to: memory/runtime/permissions/audit/
    transcript_channel: system
    tests_required: [explicit_confirmation]
    rollback_strategy: "not automatically reversible"
    codex_optional: true
    forbidden_without_authorization: true

  computer_use_control:
    tool_id: computer_use_control
    command: null
    path: tools/
    description: "Control browser/apps/computer UI."
    status: prepared
    risk: critical
    allowed_without_confirmation: false
    allowed_with_one_shot_grant: false
    requires_special_authorization: true
    external_effect: true
    dry_run_required: true
    logs_to: logs/computer_use/
    transcript_channel: tools
    tests_required: [before_after_verification, no_ocr_first]
    rollback_strategy: "action-specific"
    codex_optional: true
    forbidden_without_authorization: true
