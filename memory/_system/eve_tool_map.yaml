  self_edit_request:
    command: ".venv/Scripts/python.exe scripts/self_edit_request.py"
    path: scripts/self_edit_request.py
    description: "Create or execute controlled self-edit requests."
    status: available
    risk: medium
    allowed_without_confirmation: true
    allowed_with_one_shot_grant: true
    requires_special_authorization: false
    codex_optional: true
    external_effect: false
    dry_run_required: true
    logs_to: memory/_processed/autonomy/self_edits/
    transcript_channel: system
