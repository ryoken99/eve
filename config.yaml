eve:
  name: "Eve"
  mode: "unrestricted_mode"
  timezone: "Europe/Lisbon"
  owner: "Sandro"
  mission: "assistir Sandro, aprender, organizar, agir, melhorar e operar com liberdade total quando autorizada por Sandro"

llm:
  provider: "codex"
  model: "gpt-5.5"

paths:
  workspace: "./workspace"
  memory: "./memory"
  logs: "./logs"
  skills: "./skills"
  lab: "./lab"
  backups: "./backups"

memory:
  diary_enabled: true
  consolidation_enabled: true
  dream_enabled: false
  vector_memory_enabled: false

autonomy:
  enabled: true
  scheduled_tasks_enabled: true
  proactive_mode_enabled: true

computer_control:
  screen_capture_enabled: true
  mouse_enabled: true
  keyboard_enabled: true
  emergency_stop_hotkey: "ctrl+alt+e"

permissions:
  default_profile: "unrestricted_mode"
  require_approval_for: []

self_improvement:
  enabled: true
  lab_only: false
  require_tests: true
  require_backup: true
  require_approval_for_core_changes: false
